# colophon-roe: live ENFORCE RoE on AgentCore Gateway + Dogwood.
# High risk. The PEP is AgentCore Gateway + Dogwood (foreign); this Record
# names the declared tools, Gateway, engine, and ENFORCE mode. It does not
# reimplement Cedar/Dogwood. Bound in the agentcore-dogwood-live demo packet.
# Session id for the live capture lives in the APPLICATION_LOGS sidecar, not here.
# The Gateway records tool names as StatusTarget___<tool>; pep.tool_name_prefix
# names that projection so COL-05 re-evaluates the declared names.
# pep.policies binds the three policies the engine held during the capture:
# each sha256 is over the staged statement file under
# packages/fixtures/agentcore-dogwood/policies/, which is the get-policy
# statement with the account id masked (****) and the IAM principal
# generalized to roe-operator (the D28 rule, applied to policy text as it is
# to the log lines). policy_set_hash is sha256 over the three per-file hashes,
# sorted, newline-joined, with a trailing newline.
