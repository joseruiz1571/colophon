# red-team-coder: coding agent under an AI red-team rules of engagement.
# High risk. The PEP is AgentCore Gateway + Dogwood (foreign); this Record
# names the declared tools and the policy set, it does not reimplement them.
# Bound in the agentcore-dogwood demo packet as the signed RoE artifact.
id: b7e4c2a1-8d3f-4e2b-9c1a-6f5e4d3c2b1a
name: red-team-coder
owner: red-team@acme.example
risk_tier: high
autonomy_level: L3
