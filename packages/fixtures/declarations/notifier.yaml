# notifier: writes a notice file inside its sandbox and mails it to the team.
# Medium risk. Bounded to *@acme.example and out/notifier/.
id: 9b2d1c4e-5f6a-4b7c-8d9e-0f1a2b3c4d5e
name: notifier
owner: platform-ops@acme.example
risk_tier: medium
autonomy_level: L3
tools:
  - name: fs.write
    data_access: write
    data_classes: [internal]
  - name: mail.send
    data_access: none
    data_classes: []
    destinations: ["*@acme.example"]
data_classes: [internal]
sandbox:
  write_paths: ["out/notifier/"]
max_scopes: []
kill_switch:
  available: true
  mechanism: "disable the notifier service account"
review_due: "2027-03-31"
control_mappings:
  - { control_id: "LLM06", framework: OWASP-LLM-TOP10 }
  - { control_id: "MANAGE-2.2", framework: NIST-AI-RMF }
