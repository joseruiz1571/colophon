# Colophon control catalog v0.1.0.
# Each control names a deterministic check the report engine runs over the
# evidence store, and the phase in which it can be evaluated:
#   assess — while the packet is being built (result lands in the in-bundle AR)
#   verify — only after the bundle exists and is signed (result lands in the
#            verification AR that `colophon bundle verify --out` writes OUTSIDE
#            the bundle, because a bundle cannot attest to its own signature)
# Every check names its falsifier: the observable that would make it not-satisfied.
catalog_version: "0.1.0"
controls:
  - id: COL-01
    title: Declaration completeness
    intent: The agent's permitted behaviour was written down, in full, before it ran.
    phase: assess
    check: declaration-complete
    falsifier: A bound Record missing any of owner, risk_tier, autonomy_level, tools, data_classes, sandbox.write_paths, max_scopes, kill_switch, review_due, control_mappings; or no Record bound at all.
    framework_refs:
      - { framework: NIST-AI-RMF, ref: "GOVERN 1.1" }
      - { framework: NIST-800-53, ref: "AC-6" }
  - id: COL-02
    title: Gate fails closed
    intent: An undeclared tool and a policy-engine failure both produce deny, proven on this machine at session start.
    phase: assess
    check: gate-fail-closed
    falsifier: The startup self-test recorded any effect other than deny for the undeclared-tool probe or the OPA-error probe, or no self-test evidence exists.
    framework_refs:
      - { framework: OWASP-LLM-TOP10, ref: "LLM06:2025 Excessive Agency" }
      - { framework: NIST-800-53, ref: "AC-6" }
  - id: COL-03
    title: Every refusal names its rule and its binding field
    intent: A refusal an auditor cannot trace to a rule and a Record field is an opinion, not a control.
    phase: assess
    check: deny-has-rule-and-field
    falsifier: Any deny decision with an empty rule_ids or a reason whose field is empty; or a session with zero deny decisions (the control was not exercised and is reported not-satisfied, never vacuously satisfied).
    framework_refs:
      - { framework: NIST-AI-RMF, ref: "MEASURE 2.6" }
      - { framework: NIST-800-53, ref: "AU-3" }
  - id: COL-04
    title: Trace hash chain intact
    intent: Decisions cannot be inserted, removed, or altered after the fact without detection.
    phase: assess
    check: trace-chain-intact
    falsifier: Any line whose this_sha256 does not recompute or whose prev_sha256 does not link to the previous line.
    framework_refs:
      - { framework: NIST-800-53, ref: "AU-9" }
      - { framework: NIST-800-53, ref: "AU-10" }
  - id: COL-05
    title: Executed calls stayed inside the Record
    intent: Re-evaluating every allowed call's recorded arguments against the Record through the same policy yields allow again.
    phase: assess
    check: allowed-calls-re-evaluate
    falsifier: Any decision with effect allow whose recorded (redacted) arguments the policy now refuses — a call that executed outside the Record.
    framework_refs:
      - { framework: OWASP-LLM-TOP10, ref: "LLM06:2025 Excessive Agency" }
      - { framework: NIST-AI-RMF, ref: "MANAGE 2.2" }
  - id: COL-06
    title: Citation guard
    intent: The report cites only evidence that exists in the content-addressed store.
    phase: assess
    check: citation-guard
    falsifier: Any evidence id cited by any finding or observation that the store does not hold.
    framework_refs:
      - { framework: NIST-800-53, ref: "AU-10" }
  - id: COL-07
    title: Narrative states its limits
    intent: The human-readable report says what the packet proves and what it does not.
    phase: assess
    check: narrative-states-limits
    falsifier: A narrative without a does-not-prove statement or without the custody-versus-judgment rule.
    framework_refs:
      - { framework: NIST-AI-RMF, ref: "GOVERN 4.1" }
  - id: COL-08
    title: Manifest completeness
    intent: Every file in the bundle is listed with a matching hash, and nothing unlisted is present.
    phase: verify
    check: manifest-complete
    falsifier: A file missing, altered, or added relative to manifest.json; or a root hash that does not recompute.
    framework_refs:
      - { framework: NIST-800-53, ref: "AU-9" }
  - id: COL-09
    title: Signature present and verifies
    intent: The manifest is signed and the signature verifies against the presented key or identity.
    phase: verify
    check: signature-verifies
    falsifier: manifest.sigstore.json missing, or cosign verify-blob exits non-zero.
    framework_refs:
      - { framework: NIST-800-53, ref: "AU-10" }
  - id: COL-10
    title: No credential values in the packet
    intent: Arguments are stored as hashes and redacted views; no secret-shaped value survives.
    phase: assess
    check: secrets-redacted
    falsifier: Any decision's args_redacted containing a value that matches a known credential prefix.
    framework_refs:
      - { framework: OWASP-LLM-TOP10, ref: "LLM02:2025 Sensitive Information Disclosure" }
      - { framework: NIST-800-53, ref: "SC-28" }
